# deploy/nginx.conf
# Nginx reverse-proxy configuration for SecureDesk
# Runs in front of Gunicorn on 127.0.0.1:8000

server {
    listen 80;
    server_name _;   # Replace with your domain name or Elastic IP

    # Redirect all HTTP to HTTPS when TLS is configured
    # Uncomment once you have a certificate:
    # return 301 https://$host$request_uri;

    # ── Static files served directly by Nginx (faster than Python) ──────────
    location /static/ {
        alias /var/www/securedesk/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ── Proxy to Gunicorn ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        # Security: pass real client IP for audit logging and rate limiting
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;

        # Limit request body (defence against large-payload DoS)
        client_max_body_size 2M;
    }

    # ── Security: hide Nginx version ──────────────────────────────────────────
    server_tokens off;
}

